<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kebo Operasyon Yönetim Sistemi</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f7f7f7;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            font-family:Segoe UI,Arial,sans-serif;
        }

        .login-card{
            width:100%;
            max-width:520px;
            background:white;
            border-radius:18px;
            padding:45px;
            box-shadow:0 20px 60px rgba(0,0,0,.10);
        }

        .logo{
            text-align:center;
            margin-bottom:25px;
        }

        .logo img{
            width:220px;
        }

        h1{
            text-align:center;
            font-weight:700;
            font-size:34px;
            margin-bottom:5px;
        }

        .subtitle{
            text-align:center;
            color:#777;
            margin-bottom:35px;
        }

        .btn-login{
            background:#d92027;
            border:none;
            height:52px;
            font-size:20px;
            font-weight:bold;
        }

        .btn-login:hover{
            background:#bf1c23;
        }

        .footer{
            text-align:center;
            margin-top:25px;
            color:#888;
            font-size:14px;
        }
    </style>

</head>

<body>

<div class="login-card">

    <div class="logo">
        <img src="{{ url_for('static', filename='images/logo.jpg') }}"
     alt="KEBO Logo"
     class="img-fluid"
     style="width:240px;">


    </div>

    <h1>Kebo Operasyon Yönetim Sistemi</h1>

    <div class="subtitle">
        Şube Giriş Ekranı
    </div>

    <form method="POST" action="/login">


        <div class="mb-3">
            <label class="form-label">
                Şube Adı
            </label>

            <input
                type="text"
                class="form-control form-control-lg"
                name="sube"
                placeholder="Şube Adını Giriniz"
                required>
        </div>

        <div class="mb-4">

            <label class="form-label">
                Şifre
            </label>

            <input
                type="password"
                class="form-control form-control-lg"
                name="sifre"
                placeholder="Şifrenizi Giriniz"
                required>

        </div>

        <div class="d-flex justify-content-between mb-4">

            <div class="form-check">
                <input class="form-check-input" type="checkbox">

                <label class="form-check-label">
                    Beni Hatırla
                </label>

            </div>

            <a href="#" class="text-danger text-decoration-none">
                Şifremi Unuttum
            </a>

        </div>

        <button class="btn btn-danger btn-login w-100">
            GİRİŞ YAP
        </button>

    </form>

    <div class="footer">
        © 2026 Kebo Gıda
    </div>

</div>

</body>
</html>
