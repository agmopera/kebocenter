<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şubeler</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container-fluid mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Şubeler</h2>

        <a href="/yeni-sube" class="btn btn-danger">
            + Yeni Şube
        </a>

    </div>
<div class="row mb-3">

    <div class="col-md-4">

        <input
            type="text"
            id="aramaKutusu"
            class="form-control"
            placeholder="🔍 Şube Ara...">

    </div>

</div>

    <div class="card shadow">

        <div class="card-body">

            <table class="table table-hover align-middle">

                <thead class="table-dark">

                    <tr>

                        <th>ID</th>
                        <th>Şube Adı</th>
                        <th>Yetkili</th>
                        <th>Durum</th>
                        <th width="180">İşlem</th>

                    </tr>

                </thead>

                <tbody>

                {% if subeler %}

                    {% for s in subeler %}

                    <tr class="subeSatiri">

                        <td>{{ s[0] }}</td>

                        <td>{{ s[1] }}</td>

                        <td>{{ s[2] }}</td>

                        <td>

                            {% if s[8] == "Aktif" %}

                                <span class="badge bg-success">
                                    Aktif
                                </span>

                            {% else %}

                                <span class="badge bg-secondary">
                                    Pasif
                                </span>

                            {% endif %}

                        </td>

                        <td>

                            <a href="/sube-duzenle/{{ s[0] }}"
                               class="btn btn-sm btn-primary">

                                Düzenle

                            </a>

                            <a href="/sube-sil/{{ s[0] }}"
                               class="btn btn-sm btn-danger"
                               onclick="return confirm('Bu şubeyi silmek istediğinize emin misiniz?')">

                                Sil

                            </a>

                        </td>

                    </tr>

                    {% endfor %}

                {% else %}

                    <tr>

                        <td colspan="5" class="text-center text-muted p-5">

                            Henüz kayıtlı şube bulunmuyor.

                        </td>

                    </tr>

                {% endif %}

                </tbody>

            </table>

        </div>

    </div>

    <div class="mt-3">

        <a href="/dashboard" class="btn btn-secondary">

            ← Dashboard'a Dön

        </a>

    </div>

</div>
<script>

const aramaKutusu = document.getElementById("aramaKutusu");

aramaKutusu.addEventListener("keyup", function () {

    let filtre = this.value.toLowerCase();

    let satirlar = document.querySelectorAll(".subeSatiri");

    satirlar.forEach(function(satir){

        let metin = satir.innerText.toLowerCase();

        if(metin.includes(filtre)){

            satir.style.display = "";

        }else{

            satir.style.display = "none";

        }

    });

});

</script>

</body>

</html>
