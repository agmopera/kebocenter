<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Yeni Şube</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-danger text-white">

            <h3>Yeni Şube Ekle</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Şube Adı</label>

                        <input
                            type="text"
                            name="sube_adi"
                            id="sube_adi"
                            class="form-control"
                            onkeyup="kullaniciOlustur()"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Kullanıcı Adı</label>

                        <input
                            type="text"
                            name="kullanici_adi"
                             id="kullanici_adi"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Şifre</label>

                        <input
                            type="text"
                            name="sifre"
                             id="sifre"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Yetkili</label>

                        <input
                            type="text"
                            name="yetkili"
                            class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Telefon</label>

                        <input
                            type="text"
                            name="telefon"
                            class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">E-Posta</label>

                        <input
                            type="email"
                            name="eposta"
                            class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">İl</label>

                        <input
                            type="text"
                            name="il"
                            class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">İlçe</label>

                        <input
                            type="text"
                            name="ilce"
                            class="form-control">

                    </div>

                    <div class="col-12 mb-3">

                        <label class="form-label">Adres</label>

                        <textarea
                            name="adres"
                            class="form-control"
                            rows="4"></textarea>

                    </div>

                    <div class="col-md-6 mb-4">

                        <label class="form-label">Durum</label>

                        <select
                            name="durum"
                            class="form-select">

                            <option value="Aktif">Aktif</option>
                            <option value="Pasif">Pasif</option>

                        </select>

                    </div>
                    <div class="col-md-6 mb-3">

    <label class="form-label">Üretim Günü</label>

    <select name="uretim_gunu" class="form-select">
        <option>Pazartesi</option>
        <option>Salı</option>
        <option>Çarşamba</option>
        <option>Perşembe</option>
        <option>Cuma</option>
        <option>Cumartesi</option>
    </select>

</div>

<div class="col-md-6 mb-3">

    <label class="form-label">Sevkiyat Günü</label>

    <select name="sevkiyat_gunu" class="form-select">
        <option>Pazartesi</option>
        <option>Salı</option>
        <option>Çarşamba</option>
        <option>Perşembe</option>
        <option>Cuma</option>
        <option>Cumartesi</option>
    </select>

</div>

<div class="col-md-6 mb-3">

    <label class="form-label">Sevkiyat Saati</label>

    <input
        type="time"
        name="sevkiyat_saati"
        class="form-control"
        value="08:00">

</div>

<div class="col-md-6 mb-3">

    <label class="form-label">Tahmini Teslim Süresi</label>

    <select name="teslim_suresi" class="form-select">
        <option value="Aynı Gün">Aynı Gün</option>
        <option value="+1 Gün">+1 Gün</option>
        <option value="+2 Gün">+2 Gün</option>
        <option value="+3 Gün">+3 Gün</option>
    </select>

</div>


                </div>

                <a href="/subeler" class="btn btn-secondary">

                    İptal

                </a>

                <button type="submit" class="btn btn-danger">

                    Kaydet

                </button>

            </form>

        </div>

    </div>

</div>


<script>

function kullaniciOlustur(){

    let sube = document.getElementById("sube_adi").value;


    if(sube.length > 2){


        let kullanici = sube
            .toLowerCase()
            .replaceAll(" ","")
            .replaceAll("ı","i")
            .replaceAll("ğ","g")
            .replaceAll("ü","u")
            .replaceAll("ş","s")
            .replaceAll("ö","o")
            .replaceAll("ç","c");


        document.getElementById("kullanici_adi").value = kullanici;


        document.getElementById("sifre").value =
            kullanici + "2026";


    }

}

</script>

</body>

</html>
