<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Yeni Ürün</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-danger text-white">

<h3>Yeni Ürün Ekle</h3>

</div>

<div class="card-body">

<form method="POST" action="/yeni-urun">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">Ürün Kodu</label>

<input
type="text"
name="urun_kodu"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Ürün Adı</label>

<input
type="text"
name="urun_adi"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Kategori</label>

<select
name="kategori"
class="form-select">

<option value="Donuk">Donuk</option>

<option value="Soğuk">Soğuk</option>

<option value="Kuru Gıda">Kuru Gıda</option>

<option value="İçecek">İçecek</option>

<option value="Diğer">Diğer</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Birim</label>

<select
name="birim"
class="form-select">

<option value="Adet">Adet</option>

<option value="Koli">Koli</option>

<option value="Kg">Kg</option>

<option value="Paket">Paket</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Ürün Tipi
</label>

<select
name="urun_tipi"
class="form-select">

<option value="Donuk">
Donuk
</option>

<option value="Soğuk">
Soğuk
</option>

</select>

</div>


<div class="col-md-6 mb-3">

<label class="form-label">
Palet Kapasitesi
</label>

<input
type="number"
name="palet_kapasitesi"
class="form-control"
placeholder="Örn: 60"
required>

</div>


<div class="col-md-6 mb-3">

<label class="form-label">
Koli Ağırlığı (KG)
</label>

<input
type="number"
step="0.01"
name="koli_agirligi"
class="form-control"
placeholder="Örn: 10"
>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Ürün Tipi
</label>

<select
name="urun_tipi"
class="form-select">

<option value="Donuk">
Donuk
</option>

<option value="Soğuk">
Soğuk
</option>

</select>

</div>

<div class="col-md-6 mb-4">

<label class="form-label">Durum</label>

<select
name="durum"
class="form-select">

<option value="Aktif">Aktif</option>

<option value="Pasif">Pasif</option>

</select>

</div>
<div class="col-md-6 mb-4">

<label class="form-label">

Palet Kapasitesi

</label>

<input

type="number"

name="palet_kapasitesi"

class="form-control"

placeholder="Örn: 60"

min="1"

required>

<small class="text-muted">

Bir palette kaç koli/adet ürün olur?

</small>

</div>

</div>

<a href="/urunler" class="btn btn-secondary">

İptal

</a>

<button type="submit" class="btn btn-danger">

Kaydet

</button>

</form>

</div>

</div>

</div>

</body>

</html>
