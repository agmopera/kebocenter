<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Ürün Düzenle</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>Ürün Düzenle</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <!-- ====================================== -->
                    <!-- ÜRÜN KODU -->
                    <!-- ====================================== -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Ürün Kodu
                        </label>

                        <input
                            type="text"
                            name="urun_kodu"
                            class="form-control"
                            value="{{ urun[1] }}"
                            required
                        >

                    </div>


                    <!-- ====================================== -->
                    <!-- ÜRÜN ADI -->
                    <!-- ====================================== -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Ürün Adı
                        </label>

                        <input
                            type="text"
                            name="urun_adi"
                            class="form-control"
                            value="{{ urun[2] }}"
                            required
                        >

                    </div>


                    <!-- ====================================== -->
                    <!-- KATEGORİ -->
                    <!-- ====================================== -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Kategori
                        </label>

                        <select
                            name="kategori"
                            class="form-select"
                        >

                            <option
                                value="Donuk"
                                {% if urun[3] == "Donuk" %}selected{% endif %}
                            >
                                Donuk
                            </option>

                            <option
                                value="Soğuk"
                                {% if urun[3] == "Soğuk" %}selected{% endif %}
                            >
                                Soğuk
                            </option>

                            <option
                                value="Kuru Gıda"
                                {% if urun[3] == "Kuru Gıda" %}selected{% endif %}
                            >
                                Kuru Gıda
                            </option>

                            <option
                                value="İçecek"
                                {% if urun[3] == "İçecek" %}selected{% endif %}
                            >
                                İçecek
                            </option>

                            <option
                                value="Diğer"
                                {% if urun[3] == "Diğer" %}selected{% endif %}
                            >
                                Diğer
                            </option>

                        </select>

                    </div>


                    <!-- ====================================== -->
                    <!-- BİRİM -->
                    <!-- ====================================== -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Birim
                        </label>

                        <select
                            name="birim"
                            class="form-select"
                        >

                            <option
                                value="Adet"
                                {% if urun[4] == "Adet" %}selected{% endif %}
                            >
                                Adet
                            </option>

                            <option
                                value="Koli"
                                {% if urun[4] == "Koli" %}selected{% endif %}
                            >
                                Koli
                            </option>

                            <option
                                value="Kg"
                                {% if urun[4] == "Kg" %}selected{% endif %}
                            >
                                Kg
                            </option>

                            <option
                                value="Paket"
                                {% if urun[4] == "Paket" %}selected{% endif %}
                            >
                                Paket
                            </option>

                        </select>

                    </div>


                    <!-- ====================================== -->
                    <!-- ÜRÜN TİPİ -->
                    <!-- ====================================== -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Ürün Tipi
                        </label>

                        <select
                            name="urun_tipi"
                            class="form-select"
                        >

                            <option
                                value="Donuk"
                                {% if urun[7] == "Donuk" %}selected{% endif %}
                            >
                                Donuk
                            </option>

                            <option
                                value="Soğuk"
                                {% if urun[7] == "Soğuk" %}selected{% endif %}
                            >
                                Soğuk
                            </option>

                        </select>

                    </div>


                    <!-- ====================================== -->
                    <!-- PALET KAPASİTESİ -->
                    <!-- ====================================== -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Palet Kapasitesi
                        </label>

                        <input
                            type="number"
                            name="palet_kapasitesi"
                            class="form-control"
                            value="{{ urun[6] }}"
                            min="1"
                            required
                        >

                        <small class="text-muted">
                            Bir palette kaç koli/adet ürün olur?
                        </small>

                    </div>


                    <!-- ====================================== -->
                    <!-- KOLİ AĞIRLIĞI -->
                    <!-- ====================================== -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Koli Ağırlığı (KG)
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            name="koli_agirligi"
                            class="form-control"
                            value="{{ urun[8] }}"
                        >

                    </div>


                    <!-- ====================================== -->
                    <!-- TEDARİK ŞEKLİ -->
                    <!-- ====================================== -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Tedarik Şekli
                        </label>

                        <select
                            name="tedarik_sekli"
                            class="form-select"
                        >

                            <option
                                value="Merkez"
                                {% if urun[10] == "Merkez" or not urun[10] %}
                                    selected
                                {% endif %}
                            >
                                Merkez
                            </option>

                            <option
                                value="Tedarikçi"
                                {% if urun[10] == "Tedarikçi" %}
                                    selected
                                {% endif %}
                            >
                                Tedarikçi
                            </option>

                        </select>

                        <small class="text-muted">
                            Ürün merkezden mi yoksa doğrudan tedarikçiden mi temin ediliyor?
                        </small>

                    </div>


                    <!-- ====================================== -->
                    <!-- DURUM -->
                    <!-- ====================================== -->

                    <div class="col-md-6 mb-4">

                        <label class="form-label">
                            Durum
                        </label>

                        <select
                            name="durum"
                            class="form-select"
                        >

                            <option
                                value="Aktif"
                                {% if urun[5] == "Aktif" %}selected{% endif %}
                            >
                                Aktif
                            </option>

                            <option
                                value="Pasif"
                                {% if urun[5] == "Pasif" %}selected{% endif %}
                            >
                                Pasif
                            </option>

                        </select>

                    </div>

                </div>


                <!-- ====================================== -->
                <!-- BUTONLAR -->
                <!-- ====================================== -->

                <a
                    href="/urunler"
                    class="btn btn-secondary"
                >
                    İptal
                </a>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Güncelle
                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
