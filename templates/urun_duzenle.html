<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ürün Düzenle</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3>Ürün Düzenle</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">Ürün Kodu</label>

<input
type="text"
name="urun_kodu"
class="form-control"
value="{{ urun[1] }}"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Ürün Adı</label>

<input
type="text"
name="urun_adi"
class="form-control"
value="{{ urun[2] }}"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Kategori</label>

<select
name="kategori"
class="form-select">

<option value="Donuk" {% if urun[3]=="Donuk" %}selected{% endif %}>Donuk</option>

<option value="Soğuk" {% if urun[3]=="Soğuk" %}selected{% endif %}>Soğuk</option>

<option value="Kuru Gıda" {% if urun[3]=="Kuru Gıda" %}selected{% endif %}>Kuru Gıda</option>

<option value="İçecek" {% if urun[3]=="İçecek" %}selected{% endif %}>İçecek</option>

<option value="Diğer" {% if urun[3]=="Diğer" %}selected{% endif %}>Diğer</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Birim</label>

<select
name="birim"
class="form-select">

<option value="Adet" {% if urun[4]=="Adet" %}selected{% endif %}>Adet</option>

<option value="Koli" {% if urun[4]=="Koli" %}selected{% endif %}>Koli</option>

<option value="Kg" {% if urun[4]=="Kg" %}selected{% endif %}>Kg</option>

<option value="Paket" {% if urun[4]=="Paket" %}selected{% endif %}>Paket</option>

</select>

</div>

<div class="col-md-6 mb-4">

<label class="form-label">Durum</label>

<select
name="durum"
class="form-select">

<option value="Aktif" {% if urun[5]=="Aktif" %}selected{% endif %}>Aktif</option>

<option value="Pasif" {% if urun[5]=="Pasif" %}selected{% endif %}>Pasif</option>

</select>

</div>

</div>

<a href="/urunler" class="btn btn-secondary">

İptal

</a>

<button type="submit" class="btn btn-primary">

Güncelle

</button>

</form>

</div>

</div>

</div>

</body>

</html>
